name: Next.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Check Linting
      run: npm run lint
      
    - name: Build Next.js Application
      run: npm run build
      env:
        # Provide dummy environment variables for build if needed
        # Vercel handles the real ones in production, but Next.js build might need them
        MONGODB_URI: "mongodb://localhost:27017/dummy"
        JWT_SECRET: "dummy-secret-for-build-only"
